name: ited_study
description: "A new Flutter project."

publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.4 <4.0.0"

dependencies:
  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0
  connectivity_plus: ^6.1.2
  cupertino_icons: ^1.0.6
  device_info_plus: ^11.2.0
  dio: ^5.6.0
  dropdown_button2: ^2.3.9
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  flutter_launcher_icons: ^0.14.3
  flutter_quill: ^11.0.0-dev.17
  flutter_quill_extensions: ^11.0.0-dev.7
  flutter_riverpod: ^2.5.1
  get_it: ^8.0.2
  go_router: ^14.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.1.2
  page_transition: ^2.1.0
  percent_indicator: ^4.2.4
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1

dev_dependencies:
  analyzer: ^6.11.0
  build_runner: ^2.0.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/ited.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/ited.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/ited.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/ited.png"

  hive_generator: ^2.0.1

# dependency_overrides:
#   collection: 1.18.0
#   macro:
flutter:
  uses-material-design: true

  assets:
    - assets/images/
